translator.kura.kapua.data.deviceId.resolve=true
#
# Local caches used to resolve account ids (by account name) and device ids (by scope id and client id) when translating Kura data messages.
# Resolved ids are cached locally (per process) and are not invalidated when the account or the device is deleted:
# a deleted and recreated account/device can be resolved to its old id until its entry expires.
# Not found accounts/devices are never cached.
# Setting the size or the expiration time to a value less than or equal to 0 disables the cache.
#
# Default size and expiration time (in seconds)
translator.kura.kapua.cache.local.size.maximum=1000
translator.kura.kapua.cache.local.expire.after=3600
# Account ids cache overrides (if any value is omitted, the default equivalent will be used)
#translator.kura.kapua.cache.account.local.size.maximum=1000
#translator.kura.kapua.cache.account.local.expire.after=3600
#translator.kura.kapua.cache.account.local.expire.strategy=MODIFIED
# Device ids cache overrides (if any value is omitted, the default equivalent will be used)
# The size should be greater or equal than the number of devices publishing data messages, since each consumer receives messages from all devices
translator.kura.kapua.cache.device.local.size.maximum=10000
#translator.kura.kapua.cache.device.local.expire.after=3600
#translator.kura.kapua.cache.device.local.expire.strategy=MODIFIED
