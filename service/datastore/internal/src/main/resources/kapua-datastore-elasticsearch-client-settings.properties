#
# Provider
#datastore.elasticsearch.provider=org.eclipse.kapua.service.elasticsearch.client.transport.TransportElasticsearchClientProvider
datastore.elasticsearch.provider=org.eclipse.kapua.service.elasticsearch.client.rest.RestElasticsearchClientProvider
# Number of Elasticsearch clients to allocate to the datastore, minimum is one. The size depends upon the 
# workload and the computational resources available, usually a value in the range 1-4 works well. Use only 
# with RestElasticsearchClientProvider, set value to 1 for TransportElasticsearchClientProvider.
datastore.elasticsearch.pool.size=1
datastore.elasticsearch.module=datastore-elasticsearch-client

#
# Connection
datastore.elasticsearch.cluster=kapua-datastore
datastore.elasticsearch.nodes=192.168.33.10:9200
datastore.elasticsearch.username=
datastore.elasticsearch.password=

datastore.elasticsearch.client.reconnection_wait_between_exec=15000
#
# Max overall connection pool size of the client connection manager
# <=0 ==> use the default
datastore.elasticsearch.connection.maxTotal=30
#
# Default max connections of the client connection manager assigned to a single route.
# E.g. if total size is 30 and there are three routes set to 10 (10*3=30)
# <=0 ==> use the default
datastore.elasticsearch.connection.defaultMaxPerRoute=10

#
# Requests
datastore.elasticsearch.request.query.timeout=15000
datastore.elasticsearch.request.scroll.timeout=60000
datastore.elasticsearch.request.retry.max=3
datastore.elasticsearch.request.retry.wait=2500

#
# SSL
datastore.elasticsearch.ssl.enabled=false
datastore.elasticsearch.ssl.trust_server_certificate=false
datastore.elasticsearch.ssl.keystore.path=
datastore.elasticsearch.ssl.keystore.password=
datastore.elasticsearch.ssl.keystore.type=jks
datastore.elasticsearch.ssl.truststore.path=
datastore.elasticsearch.ssl.truststore.password=

