device.registry.key=device.registry
device.eventAddress=device
device.lifecycle.birth.var.fields.length.max=4096
device.lifecycle.birth.extended.properties.length.max=524288
device.connection.authentication.type.default=USER_PASS
#
# Local cache of devices by scope id and client id, used by the cached DeviceRegistryService (@Named("cachedDeviceRegistryService")).
# Entries are not invalidated when a device is updated or deleted: a changed device is returned as it was until its entry expires.
# The size should be greater or equal than the number of devices publishing messages, since each consumer receives messages from all devices.
# Setting the size or the expiration time (in seconds) to 0 disables the cache.
device.registry.cache.local.size.maximum=10000
device.registry.cache.local.expire.after=3600
#device.registry.cache.local.expire.strategy=MODIFIED
